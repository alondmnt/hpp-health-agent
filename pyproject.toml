[project]
name = "hpp-health-agent"
version = "0.1.0"
description = "Minimal implementation of the HPP metabolic health agent architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Pinned to the exact versions this was developed and run against, so the
# demo is reproducible. Relax them if you are building on top of this.
dependencies = [
    # LLM orchestration (DSPy uses LiteLLM underneath, so any provider works)
    "dspy==3.0.3",
    # Data validation
    "pydantic==2.12.3",
    # Data processing
    "pandas==2.3.3",
    "numpy==2.3.4",
    "pyarrow==22.0.0",
    "scipy==1.16.3",
    # CGM metrics
    "iglu-python==0.4.1",
    # Figures
    "matplotlib==3.10.7",
    # Skill frontmatter
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pha", "tools", "evals"]
